function controls(){
 if(pressed.gas && !pressed.rearBrake){throttleHold=Math.min(.55,throttleHold+1/60);}
 else throttleHold=0;
 // Rear wheel motor is the ONLY engine. Front wheel is always freely rolling
 // unless its brake is applied. No force is added to chassis velocity.
 if(pressed.rearBrake)safeSetMotor(rearJoint,true,0,65);
 else if(pressed.gas){
  // Less aggressive initial launch: 18% less motor torque at first touch,
  // gradually restores baseline torque in 0.55 s. Top speed unchanged.
  const launchFactor=.82+.18*Math.min(1,throttleHold/.55);
  safeSetMotor(rearJoint,true,24,48*launchFactor);
 }
 else safeSetMotor(rearJoint,false,0,0);
 if(pressed.frontBrake)safeSetMotor(frontJoint,true,0,72);
 else safeSetMotor(frontJoint,false,0,0);
 const lean=(pressed.forward?1:0)-(pressed.back?1:0);
 if(lean){frame.applyTorque(lean*(lean<0?16.2:18),true);} // nose-up is 10% gentler
}

let last=performance.now(),acc=0;
function loop(now){requestAnimationFrame(loop);let delta=Math.min(.05,(now-last)/1000||0);last=now;
 if(playing){acc=Math.min(2/60,acc+delta);while(acc>=1/60){controls();world.step(1/60,8,3);elapsed+=1/60;acc-=1/60;
  if(queuedCrash){die(queuedCrash);queuedCrash='';break;}
  if(frame.getPosition().y>Math.max(16,current.maxTerrainY+6)){die('Улетел с трассы');break;}
  if(frame.getPosition().x>current.finish){won=true;playing=false;show('🏁 ФИНИШ!',`Трасса «${current.name}». Время: ${elapsed.toFixed(1)} с. Выбери следующую трассу или повтори попытку.`,'ИГРАТЬ ЕЩЁ');break;}
  // Rider pitched far past normal control range: fall rather than self-righting.
  const angle=frame.getAngle();if(Math.abs(angle)>2.9&&Math.abs(frame.getAngularVelocity())>1.5){die('Переворот');break;}
 }updateHUD();}
 draw();}
init();requestAnimationFrame(loop);
})();
</script></body></html>
