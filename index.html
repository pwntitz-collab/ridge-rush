<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ridge Rush — Prototype 0.2</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101c2f;color:#fff;font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none;user-select:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:fixed;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none;gap:10px}#hud>div{background:#101a2bd9;border:1px solid #ffffff25;border-radius:12px;padding:10px 14px;backdrop-filter:blur(8px)}small{font-size:11px;color:#a9bfd9;font-weight:700;letter-spacing:.1em}strong{font-size:20px;display:block;font-variant-numeric:tabular-nums}#actions{position:fixed;top:100px;right:16px;display:flex;gap:8px}button{font:inherit;cursor:pointer;touch-action:none;color:#fff;border:1px solid #ffffff35;background:#243d5dcf;border-radius:14px;padding:12px 16px}button:active,.held{background:#ec9947!important;color:#14202c!important}#controls{position:fixed;bottom:22px;left:20px;right:20px;display:flex;justify-content:space-between;gap:20px;pointer-events:none}.cluster{display:flex;gap:12px;pointer-events:auto}.control{width:clamp(66px,11vw,96px);height:clamp(64px,12vh,90px);font-size:24px;background:#14263cdd;border:2px solid #ffffff40;box-shadow:0 8px 30px #0004}.control span{display:block;font-size:10px;letter-spacing:.06em}#help{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;background:#14263cba;border-radius:8px;padding:6px 12px;white-space:nowrap;font-size:12px;color:#d7e6f8;pointer-events:none}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:#06132488;backdrop-filter:blur(4px)}#overlay[hidden]{display:none}#panel{max-width:min(92vw,460px);background:#15263de8;border:1px solid #ffffff35;border-radius:24px;text-align:center;padding:28px 32px;box-shadow:0 30px 80px #0009}h1{font-size:clamp(25px,5vw,40px);margin:0 0 10px}p{line-height:1.5;color:#c7d9ed}#start{background:#f2a04f;color:#14202c;padding:14px 30px;border:0;font-weight:800}#progress{position:fixed;top:82px;left:16px;right:16px;height:5px;background:#ffffff22;border-radius:12px;overflow:hidden}#progressbar{height:100%;width:0%;background:#f7a65d;transition:width .1s}@media(hover:hover) and (pointer:fine){#controls{opacity:.4}.control{width:74px;height:68px}#help{bottom:22px}}@media(max-width:600px){#hud{top:10px;left:10px;right:10px}#hud>div{padding:8px 11px}strong{font-size:16px}#actions{top:72px;right:10px}#actions button{padding:9px}#progress{top:62px;left:10px;right:10px}#help{display:none}#controls{bottom:18px;left:10px;right:10px;gap:6px}.cluster{gap:7px}.control{width:clamp(63px,18vw,80px);height:74px;font-size:23px}}</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div><small>ВРЕМЯ</small><strong id="time">00:00.0</strong></div><div><small>ЛУЧШЕЕ</small><strong id="best">—</strong></div><div><small>СКОРОСТЬ</small><strong id="speed">0 км/ч</strong></div></div>
<div id="progress"><div id="progressbar"></div></div>
<div id="actions"><button id="reset" aria-label="Начать заново">↻ Заново</button></div>
<div id="controls"><div class="cluster"><button class="control" data-key="back" aria-label="Наклон назад">↶<span>НАЗАД</span></button><button class="control" data-key="forward" aria-label="Наклон вперёд">↷<span>ВПЕРЁД</span></button></div><div class="cluster"><button class="control" data-key="brake" aria-label="Тормоз">◀<span>ТОРМОЗ</span></button><button class="control" data-key="gas" aria-label="Газ">▶<span>ГАЗ</span></button></div></div>
<div id="help">→ / D газ · ← / A тормоз · ↑ / W наклон назад · ↓ / S наклон вперёд · R заново</div>
<div id="overlay"><div id="panel"><h1 id="headline">🏍️ RIDGE RUSH</h1><p id="message">Физическая мотогонка по холмам. Держи равновесие и доберись до финиша. Переворот головой вниз — поражение.</p><button id="start">ПОЕХАЛИ!</button></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const el=id=>document.getElementById(id),overlay=el('overlay'),headline=el('headline'),message=el('message');
const keys={gas:false,brake:false,back:false,forward:false};
const KEYMAP={ArrowRight:'gas',KeyD:'gas',ArrowLeft:'brake',KeyA:'brake',ArrowUp:'back',KeyW:'back',ArrowDown:'forward',KeyS:'forward'};
let W=0,H=0,dpr=1,zoom=1,cameraX=0,cameraY=0;
const FINISH=2450,SPAWN=100;
const terrainPoints=[[-300,390],[0,390],[160,390],[310,388],[440,365],[535,390],[640,435],[765,435],[865,400],[975,340],[1060,340],[1175,390],[1290,405],[1380,360],[1470,315],[1540,345],[1620,400],[1710,438],[1800,430],[1900,380],[1990,335],[2075,340],[2160,385],[2250,385],[2350,350],[2450,345],[2750,345]];
// Cubic smooth interpolation preserving heights and eliminating sharp joints.
function height(x){let i=0;while(i<terrainPoints.length-2&&x>terrainPoints[i+1][0])i++;const p=terrainPoints[i],q=terrainPoints[i+1];let t=Math.max(0,Math.min(1,(x-p[0])/(q[0]-p[0])));let a=terrainPoints[Math.max(0,i-1)],b=terrainPoints[Math.min(terrainPoints.length-1,i+2)];let m0=(q[1]-a[1])/(q[0]-a[0])*(q[0]-p[0]),m1=(b[1]-p[1])/(b[0]-p[0])*(q[0]-p[0]);return (2*t**3-3*t*t+1)*p[1]+(t**3-2*t*t+t)*m0+(-2*t**3+3*t*t)*q[1]+(t**3-t*t)*m1}
function slope(x){return (height(x+2)-height(x-2))/4}
const bike={x:SPAWN,y:325,vx:0,vy:0,a:0,av:0,grounded:false,crashed:false,finished:false};
const R=16,HALF=30,AXLE_Y=14,G=880,DRIVE=520,BRAKE=700,MAX=410;
// Storage can be blocked in iOS file previews and embedded browser sandboxes.
function safeLoadBest(){try{return Number(window.localStorage.getItem('ridgerush_best'))||0}catch(_){return 0}}
function safeSaveBest(value){try{window.localStorage.setItem('ridgerush_best',String(value))}catch(_){}}
let playing=false,elapsed=0,last=0,particles=[],best=safeLoadBest();
function pretty(t){let m=Math.floor(t/60),s=Math.floor(t%60),d=Math.floor((t%1)*10);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${d}`}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);zoom=Math.min(1.15,Math.max(.62,W/950));}
window.addEventListener('resize',resize);resize();
function restart(){Object.assign(bike,{x:SPAWN,y:height(SPAWN)-60,vx:0,vy:0,a:0,av:0,grounded:false,crashed:false,finished:false});particles=[];elapsed=0;playing=true;overlay.hidden=true;cameraX=bike.x-W*.28/zoom;cameraY=190-H*.48/zoom;for(const k in keys)keys[k]=false;document.querySelectorAll('.control').forEach(b=>b.classList.remove('held'))}
function finish(win){playing=false;bike.crashed=!win;bike.finished=win;overlay.hidden=false;if(win){if(!best||elapsed<best){best=elapsed;safeSaveBest(best)}headline.textContent='🏁 ФИНИШ!';message.textContent=`Твоё время — ${pretty(elapsed)}. Лучший результат: ${pretty(best)}. Сможешь быстрее?`;el('start').textContent='ЕЩЁ ЗАЕЗД'}else{headline.textContent='💥 ПАДЕНИЕ!';message.textContent=`Ты проехал ${Math.round(Math.max(0,bike.x-SPAWN))} м. Попробуй удержать баланс на холмах.`;el('start').textContent='ПОПРОБОВАТЬ ЕЩЁ'}}
function update(dt){if(!playing)return;elapsed+=dt;const b=bike;
 const support=[];
 // Wheels: world coordinates; positive angle rotates bike nose down.
 function wheel(localX){return {x:b.x+localX*Math.cos(b.a)-AXLE_Y*Math.sin(b.a),y:b.y+localX*Math.sin(b.a)+AXLE_Y*Math.cos(b.a),localX};}
 let back=wheel(-HALF),front=wheel(HALF);
 for(const wh of [back,front]){let penetration=wh.y+R-height(wh.x);if(penetration>-4&&penetration<34&&b.vy>-110)support.push({wh,penetration});}
 b.grounded=support.length>0;
 if(b.grounded){const avg=(slope(back.x)+slope(front.x))/2,angle=Math.atan(avg);const slopeFactor=1/Math.sqrt(1+avg*avg);if(keys.gas)b.vx+=DRIVE*dt*slopeFactor;if(keys.brake){if(b.vx>12)b.vx-=BRAKE*dt;else b.vx-=180*dt;}b.vx-=b.vx*.5*dt;
   // Mild auto-stabilization, control can overcome it.
   let delta=Math.atan2(Math.sin(angle-b.a),Math.cos(angle-b.a));b.av+=delta*16*dt-b.av*5*dt;
   const desired=Math.min(...support.map(s=>height(s.wh.x)-R-(s.wh.localX*Math.sin(b.a)+AXLE_Y*Math.cos(b.a))));
   if(b.y>desired-7){b.y=Math.min(b.y,desired);b.vy=Math.min(0,b.vy);}
   if(keys.back)b.av-=6*dt;if(keys.forward)b.av+=6*dt;
 }else{b.vy+=G*dt;b.vx-=b.vx*.035*dt;if(keys.back)b.av-=11*dt;if(keys.forward)b.av+=11*dt;b.av*=Math.max(0,1-0.12*dt)}
 b.vx=Math.max(-105,Math.min(MAX,b.vx));b.av=Math.max(-5.2,Math.min(5.2,b.av));b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.av*dt;
 // Collision detection after integration; correct wheel contacts by resolving position.
 back=wheel(-HALF);front=wheel(HALF);let maxPen=Math.max(back.y+R-height(back.x),front.y+R-height(front.x));
 if(maxPen>0&&b.vy>=-100){b.y-=maxPen;b.vy=Math.min(0,b.vy);let delta=Math.atan2(Math.sin(Math.atan(slope(b.x))-b.a),Math.cos(Math.atan(slope(b.x))-b.a));b.av+=delta*1.5*dt;}
 // Rider head center is above seat; crash only on substantial head impact.
 const hx=b.x+0*Math.cos(b.a)+35*Math.sin(b.a),hy=b.y-35*Math.cos(b.a);
 if(hy+10>height(hx)-1||maxPen>50||b.y>1050){finish(false);return;}
 if(b.x>=FINISH){finish(true);return;}
 if(b.x<20){b.x=20;b.vx=0;}
 if((keys.gas&&b.grounded&&Math.random()<.4)||(maxPen>2&&Math.abs(b.vy)>30)){particles.push({x:back.x,y:height(back.x)-2,vx:-25-Math.random()*50,vy:-35-Math.random()*25,age:0});}
 particles=particles.filter(p=>(p.age+=dt)<.6);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt}
}
function render(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#9dd4fa';ctx.fillRect(0,0,W,H);
 const tx= W*.29/zoom,ty=H*.5/zoom;
 const cameraTargetX=bike.x-tx,cameraTargetY=bike.y-ty;
 cameraX+=(cameraTargetX-cameraX)*.075;cameraY+=(cameraTargetY-cameraY)*.055;
 ctx.save();ctx.scale(zoom,zoom);ctx.translate(-cameraX,-cameraY);
 const left=cameraX-100,right=cameraX+W/zoom+100;
 // Sky clouds
 for(let i=0;i<13;i++){let x=120+i*290,y=110+Math.sin(i*3)*43;ctx.fillStyle='#ffffff8a';ctx.beginPath();ctx.ellipse(x,y,70,18,0,0,Math.PI*2);ctx.fill();}
 // Distant mountains
 ctx.beginPath();ctx.moveTo(left,600);for(let x=Math.floor(left/30)*30;x<=right+40;x+=30){ctx.lineTo(x,260+32*Math.sin(x*.0035)+19*Math.sin(x*.009));}ctx.lineTo(right,1000);ctx.lineTo(left,1000);ctx.closePath();ctx.fillStyle='#85bdd2';ctx.fill();
 // Ground fill and crisp line
 ctx.beginPath();ctx.moveTo(left,1000);ctx.lineTo(left,height(left));for(let x=left;x<=right;x+=5)ctx.lineTo(x,height(x));ctx.lineTo(right,height(right));ctx.lineTo(right,1000);ctx.closePath();ctx.fillStyle='#375c47';ctx.fill();
 ctx.beginPath();for(let x=left;x<=right;x+=4){const y=height(x);if(x===left)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle='#92c46c';ctx.lineWidth=9;ctx.lineJoin='round';ctx.stroke();
 ctx.beginPath();for(let x=left;x<=right;x+=4){const y=height(x);if(x===left)ctx.moveTo(x,y+6);else ctx.lineTo(x,y+6)}ctx.strokeStyle='#254637';ctx.lineWidth=3;ctx.stroke();
 // Ground texture
 for(let x=Math.floor(left/32)*32;x<=right;x+=32){let y=height(x)+16;ctx.fillStyle='#53785b';ctx.fillRect(x,y,7,3);ctx.fillRect(x+12,y+32,13,3)}
 // Start and finish
 function flag(x,label){let y=height(x);ctx.strokeStyle='#f7f9fd';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-105);ctx.stroke();ctx.fillStyle=label==='FINISH'?'#f6ba53':'#28546c';ctx.fillRect(x,y-105,65,30);ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.fillText(label,x+5,y-85)}
 flag(SPAWN-55,'START');flag(FINISH,'FINISH');
 for(const p of particles){ctx.fillStyle='#eac88f';ctx.globalAlpha=1-p.age/.6;ctx.beginPath();ctx.arc(p.x,p.y,3+p.age*3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
 // Bike with wheels and rider. Two-wheel geometry aligns with physics.
 ctx.save();ctx.translate(bike.x,bike.y);ctx.rotate(bike.a);
 const wheelDraw=x=>{ctx.fillStyle='#151b27';ctx.beginPath();ctx.arc(x,AXLE_Y,R,0,2*Math.PI);ctx.fill();ctx.strokeStyle='#dde4e9';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,AXLE_Y,10,0,2*Math.PI);ctx.stroke();ctx.fillStyle='#8eabb5';ctx.beginPath();ctx.arc(x,AXLE_Y,4,0,2*Math.PI);ctx.fill();};
 wheelDraw(-HALF);wheelDraw(HALF);
 ctx.strokeStyle='#f57b3e';ctx.lineWidth=6;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-HALF,AXLE_Y);ctx.lineTo(-5,-8);ctx.lineTo(14,AXLE_Y);ctx.lineTo(-HALF,AXLE_Y);ctx.lineTo(31,-10);ctx.stroke();
 ctx.strokeStyle='#222a37';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(27,-11);ctx.lineTo(36,-15);ctx.moveTo(-13,-14);ctx.lineTo(3,-14);ctx.stroke();
 // Rider helmet, arms, torso, legs
 ctx.strokeStyle='#273747';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-9,-28);ctx.lineTo(-17,-18);ctx.lineTo(-4,1);ctx.moveTo(-14,-20);ctx.lineTo(8,-10);ctx.lineTo(29,-13);ctx.stroke();
 ctx.strokeStyle='#e6503f';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(-9,-43);ctx.lineTo(-9,-29);ctx.stroke();
 ctx.fillStyle='#f0c29a';ctx.beginPath();ctx.arc(-8,-51,10,0,2*Math.PI);ctx.fill();ctx.fillStyle='#f2a14c';ctx.beginPath();ctx.arc(-8,-53,12,Math.PI,Math.PI*2);ctx.lineTo(2,-50);ctx.lineTo(-17,-50);ctx.fill();
 ctx.restore();ctx.restore();
 el('time').textContent=pretty(elapsed);el('best').textContent=best?pretty(best):'—';el('speed').textContent=`${Math.round(Math.abs(bike.vx)*.16)} км/ч`;el('progressbar').style.width=`${Math.max(0,Math.min(100,(bike.x-SPAWN)/(FINISH-SPAWN)*100))}%`;
}
function tick(ms){const dt=Math.min(.036,(ms-last)/1000||.016);last=ms;const steps=Math.max(1,Math.ceil(dt/.008));for(let i=0;i<steps;i++)update(dt/steps);render();requestAnimationFrame(tick)}requestAnimationFrame(tick);
function setKey(k,on){if(k in keys)keys[k]=on}
window.addEventListener('keydown',e=>{if(e.code==='KeyR'){restart();return}let k=KEYMAP[e.code];if(k){e.preventDefault();if(!playing&&overlay.hidden===false)return;setKey(k,true)}});window.addEventListener('keyup',e=>{let k=KEYMAP[e.code];if(k){e.preventDefault();setKey(k,false)}});window.addEventListener('blur',()=>{for(let k in keys)keys[k]=false});
for(let b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;const down=e=>{e.preventDefault();if(b.setPointerCapture){try{b.setPointerCapture(e.pointerId)}catch(_){}}setKey(k,true);b.classList.add('held')},up=e=>{e.preventDefault();setKey(k,false);b.classList.remove('held')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);}
el('reset').addEventListener('click',restart);
el('start').addEventListener('click',restart);
// Fallback for older touch browsers that don't deliver pointer events reliably.
for(const b of document.querySelectorAll('[data-key]')){
  if(!window.PointerEvent){
    b.addEventListener('touchstart',e=>{e.preventDefault();setKey(b.dataset.key,true)},{passive:false});
    for(const eventName of ['touchend','touchcancel'])b.addEventListener(eventName,e=>{e.preventDefault();setKey(b.dataset.key,false)},{passive:false});
  }
}

})();
</script>
</body></html>
